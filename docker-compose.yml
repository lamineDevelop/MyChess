services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: mychess-db
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-chessconnect}'
      POSTGRES_USER: '${POSTGRES_USER:-chess}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
      - './backups:/backups'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chessconnect}'
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: mychess-backend
    environment:
      TZ: Europe/Paris
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chessconnect}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER:-chess}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'

      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required}'

      FRONTEND_URL: '${FRONTEND_URL:-https://mychess.fr}'

      STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY}'
      STRIPE_PUBLISHABLE_KEY: '${STRIPE_PUBLISHABLE_KEY}'
      STRIPE_WEBHOOK_SECRET: '${STRIPE_WEBHOOK_SECRET}'

      SPRING_MAIL_HOST: '${MAIL_HOST:-smtp.gmail.com}'
      SPRING_MAIL_PORT: '${MAIL_PORT:-587}'
      SPRING_MAIL_USERNAME: '${MAIL_USERNAME:-}'
      SPRING_MAIL_PASSWORD: '${MAIL_PASSWORD:-}'
      SPRING_MAIL_ENABLED: '${MAIL_ENABLED:-false}'

      ADMIN_EMAIL: '${ADMIN_EMAIL:-support@mychess.fr}'

      JITSI_APP_ID: '${JITSI_APP_ID:-mychess}'
      JITSI_APP_SECRET: '${JITSI_APP_SECRET:?JITSI_APP_SECRET is required}'
      JITSI_DOMAIN: '${JITSI_DOMAIN:-meet.mychess.fr}'

      JIBRI_WEBHOOK_SECRET: '${JIBRI_WEBHOOK_SECRET:-}'

      BUNNY_STREAM_API_KEY: '${BUNNY_STREAM_API_KEY:-}'
      BUNNY_STREAM_LIBRARY_ID: '${BUNNY_STREAM_LIBRARY_ID:-590076}'
      BUNNY_STREAM_CDN_HOSTNAME: '${BUNNY_STREAM_CDN_HOSTNAME:-vz-34fe20be-093.b-cdn.net}'

      BUNNY_STORAGE_ZONE: '${BUNNY_STORAGE_ZONE:-mychess}'
      BUNNY_STORAGE_API_KEY: '${BUNNY_STORAGE_API_KEY:-}'
      BUNNY_STORAGE_HOST: '${BUNNY_STORAGE_HOST:-storage.bunnycdn.com}'
      BUNNY_CDN_URL: '${BUNNY_CDN_URL:-https://mychess.b-cdn.net}'

      VAPID_PUBLIC_KEY: '${VAPID_PUBLIC_KEY:-}'
      VAPID_PRIVATE_KEY: '${VAPID_PRIVATE_KEY:-}'
      VAPID_SUBJECT: '${VAPID_SUBJECT:-mailto:support@mychess.fr}'

      MAINTENANCE_MODE: '${MAINTENANCE_MODE:-false}'

    volumes:
      - 'uploads_data:/app/uploads'
      - '/var/jibri/recordings:/var/jibri/recordings'
      - '/tmp/video-concat:/tmp/video-concat'

    depends_on:
      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: mychess-frontend
    environment:
      PORT: 4000
      API_URL: 'http://backend:8282/api'
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data: