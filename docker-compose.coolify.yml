# MyChess — stack Coolify (postgres + backend + frontend)
# Dans Coolify : Build Pack = Docker Compose, fichier = docker-compose.coolify.yml
# Le compose local (docker-compose.yml) reste inchangé pour le dev.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chessconnect}
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess} -d ${POSTGRES_DB:-chessconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    environment:
      TZ: Europe/Paris
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chessconnect}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chess}
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${SERVICE_URL_FRONTEND}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_ENABLED: ${MAIL_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-support@mychess.fr}
      JITSI_APP_ID: ${JITSI_APP_ID:-mychess}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-change-me-for-first-deploy}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
      JIBRI_WEBHOOK_SECRET: ${JIBRI_WEBHOOK_SECRET:-}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-590076}
      BUNNY_STREAM_CDN_HOSTNAME: ${BUNNY_STREAM_CDN_HOSTNAME:-}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE:-mychess}
      BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY:-}
      BUNNY_STORAGE_HOST: ${BUNNY_STORAGE_HOST:-storage.bunnycdn.com}
      BUNNY_CDN_URL: ${BUNNY_CDN_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@mychess.fr}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      API_URL: http://backend:8282/api
    expose:
      - "4000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
